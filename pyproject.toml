[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "affinity-code-viewer"
version = "0.1.1"
description = "A modern replacement for cat and bat"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pygments>=2.15.0",
    "watchdog>=3.0.0",
    "prompt_toolkit>=3.0.0",
    "pyperclip>=1.8.0",
]

[project.scripts]
affinity = "affinity.cli:main"

